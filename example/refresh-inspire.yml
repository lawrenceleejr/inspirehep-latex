# Refresh the INSPIRE figures on a schedule, so a document never carries a
# stale citation count.
#
# Copy this to .github/workflows/refresh-inspire.yml in a repository and set
# MAIN below to your main .tex file.  On every push, weekly, and on a button it
# fetches the figures, commits the data file it writes, and keeps a copy as a
# run artifact.
#
# The fetcher is downloaded from the package repository at run time, so nothing
# from inspirehep needs to live in your document's repository -- not the script,
# not a submodule.  Only inspirehep.sty has to reach whatever compiles the
# document, which for Overleaf means uploading it to the project once.
#
# --- getting the result into Overleaf: GitHub sync ------------------------
#
# If the document lives in this repository, link the Overleaf project to it
# (Menu -> Sync -> GitHub) and the refreshed data file arrives with everything
# else: Sync -> GitHub -> "Pull GitHub changes".  No URL anywhere.
#
# Overleaf will refuse at first, because GitHub requires the `workflow' OAuth
# scope before any app may write under .github/workflows/, and Overleaf's sync
# pushes the whole tree:
#
#   The Overleaf GitHub sync service couldn't sync GitHub Workflow files
#   (in .github/workflows/).  Please authorize Overleaf to edit your GitHub
#   workflow files and try again.
#
# Take it literally: there is a button to authorize workflow editing.  Click
# it, retry the link, and it works.  If the first attempt already created the
# repository before failing, delete that orphan or choose a new name.
#
# Overleaf's GitHub sync is a paid feature, and it does not poll -- you press
# Pull, so the numbers move when you are looking at the document rather than
# behind your back.  And because this workflow commits, a later "Push Overleaf
# changes" can conflict on the data file; pull first and it resolves, since
# nothing but the fetcher ever edits that file.
#
# --- or, if the document lives only in Overleaf ---------------------------
#
# Then this repository exists only to run the fetcher, and one file has to
# cross over.  Add file -> From external URL, with
#
#   https://raw.githubusercontent.com/<user>/<repo>/main/inspirehep-data.tex
#
# named inspirehep-data.tex.  Overleaf shows a "Refresh" button on that file
# from then on, which re-fetches whatever this workflow last committed.  Add
# inspirehep.sty the same way, or upload it once by hand.  This route needs no
# Overleaf-to-GitHub authorisation at all.
#
# --- why not the workflow artifact ----------------------------------------
#
# Overleaf cannot read one, which is why this commits rather than relying on
# the upload below.  Artifacts are served as ZIP archives rather than as the
# file itself, and downloading one needs an authenticated request even on a
# public repository, while Overleaf issues a plain unauthenticated GET.  The
# artifact is still worth having as a per-run record of what was fetched.
#
# Overleaf cannot run the fetcher itself either: no shell escape, no network.
# That is what this workflow is for.

name: Refresh INSPIRE data

on:
  # Every push, so the figures are current the moment you touch the document.
  #
  # This workflow pushes a commit of its own, which looks like a loop and is
  # not: a push made with the default GITHUB_TOKEN does not trigger further
  # workflow runs.  The [skip ci] in the commit message below is the backstop
  # for anyone who swaps in a personal access token, which does trigger them.
  push:
  schedule:
    # Mondays at 06:00 UTC.  Citation counts move slowly, so this is really
    # just insurance for a document nobody has pushed to in a while.
    - cron: '0 6 * * 1'
  workflow_dispatch:          # and a button, for when you want it now

permissions:
  contents: write             # the commit below; nothing else needs writing

# Two runs committing to one branch would race.  Per-ref, so work on a branch
# never waits on main; never cancelling, so a run is not killed mid-push.
concurrency:
  group: refresh-inspire-${{ github.ref }}
  cancel-in-progress: false

env:
  MAIN: main.tex                     # your document
  DATA: inspirehep-data.tex          # the figures
  BIB:  inspirehep-refs.bib          # BibTeX for everything \inspirecite'd

  # Which version of the fetcher to run.  `main' tracks the latest; a tag
  # (v0.3, say) pins it, which is worth doing once a tag has what you need --
  # check that it is not older than a fix you depend on before pinning to one.
  PKG: lawrenceleejr/inspirehep-latex
  PKG_REF: main

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'      # the fetcher needs only the standard library

      # -f matters: without it a bad PKG_REF gets you GitHub's "404: Not Found"
      # page saved as a Python file, and a baffling syntax error later.  The
      # --help run then proves what arrived really is the script.
      - name: Fetch the helper from the package repository
        run: |
          set -e
          curl -fsSL -o inspirehep-fetch.py \
            "https://raw.githubusercontent.com/$PKG/$PKG_REF/inspirehep-fetch.py"
          python3 inspirehep-fetch.py --help > /dev/null
          echo "using inspirehep-fetch.py from $PKG@$PKG_REF"

      # --strict everywhere except on a push.  A scheduled or manual run exists
      # only to refresh the figures, so if INSPIRE cannot be reached it should
      # say so rather than quietly do nothing.  A push is different: you were
      # fixing a typo, and inspirehep.net having a bad minute is no reason to
      # turn that red.  Without --strict a failed lookup leaves the committed
      # numbers alone and exits 0.
      - name: Fetch from INSPIRE-HEP
        run: |
          set -e
          # --bib collects INSPIRE's own BibTeX entry, verbatim, for every id
          # the document \inspirecite's, so \bibliography{inspirehep-refs}
          # resolves without anyone hand-copying an entry.  It is written only
          # if something is actually cited.
          args="$MAIN --output $DATA --bib $BIB"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 inspirehep-fetch.py $args
          else
            python3 inspirehep-fetch.py $args --strict
          fi

      - name: Commit the refreshed figures
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The generated files only.  The fetcher itself was downloaded into
          # the working tree above and has no business being committed.  The
          # .bib exists only if the document cites something, so it is added
          # when present rather than unconditionally -- git add on a missing
          # path is a fatal error, which under set -e would end the run.
          staged=""
          for f in "$DATA" "$BIB"; do
            if [ -f "$f" ]; then
              git add -- "$f"
              staged="$staged $f"
            fi
          done
          # Nothing to do if they are byte-identical, which happens when this
          # runs twice in a day and no count moved.  On the weekly schedule the
          # data file will normally differ, because the fetcher records the date
          # it confirmed the numbers and that line drives the package's "these
          # figures are getting old" warning -- so a weekly one-line commit is
          # the point rather than noise.  The .bib changes far less often, since
          # a published entry rarely does.
          if git diff --quiet --cached -- $staged; then
            echo "unchanged; nothing to commit"
            exit 0
          fi
          # [skip ci] keeps this from waking whatever else builds on push.
          git commit -m "Refresh INSPIRE figures [skip ci]"
          git push

      # A per-run copy, so a run's log shows exactly what it fetched.  This is
      # for you, not for Overleaf -- see the note at the top.
      - uses: actions/upload-artifact@v4
        with:
          name: inspirehep-data
          # The .bib may not exist if nothing is cited; error still applies to
          # the pair, and the data file is always written.
          path: |
            ${{ env.DATA }}
            ${{ env.BIB }}
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          {
            echo '## INSPIRE figures'
            echo
            if [ -f "$DATA" ]; then
              echo '```'
              grep -E '^\\inspiresetauthorstat|^\\inspiresetfetched' "$DATA" || true
              echo '```'
              echo "$(grep -c '^\\inspiresetcites' "$DATA") record(s) tracked."
            else
              echo 'The fetch produced nothing.'
            fi
            if [ -f "$BIB" ]; then
              echo
              echo "$(grep -c '^@' "$BIB") BibTeX entr(y|ies) in $BIB."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
