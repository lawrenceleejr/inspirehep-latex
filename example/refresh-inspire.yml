# Refresh the INSPIRE figures on a schedule, so a document never carries a
# stale citation count.
#
# Copy this to .github/workflows/refresh-inspire.yml in a repository, set MAIN
# below to your main .tex file, and it runs the fetcher weekly (or on a button),
# commits the data file it writes, and keeps a copy as a run artifact.
#
# --- getting the result into Overleaf --------------------------------------
#
# Point Overleaf at the committed file: Add file -> From external URL, with
#
#   https://raw.githubusercontent.com/<user>/<repo>/main/inspirehep-data.tex
#
# named inspirehep-data.tex.  Overleaf then shows a "Refresh" button on that
# file, which re-fetches whatever this workflow last committed.  Add
# inspirehep.sty the same way, or upload it once by hand.
#
# Do NOT expect Overleaf's GitHub sync to carry this workflow.  Linking an
# Overleaf project to a repository that contains .github/workflows/ fails:
#
#   The Overleaf GitHub sync service couldn't sync GitHub Workflow files
#   (in .github/workflows/).  Please authorize Overleaf to edit your GitHub
#   workflow files and try again.
#
# GitHub requires the `workflow' OAuth scope before any app may write under
# .github/workflows/, and Overleaf's sync pushes the whole tree.  Worse, that
# failure can happen after Overleaf has already created the repository, leaving
# an orphan you have to delete before retrying.
#
# So if you want Overleaf's GitHub sync as well, keep the two apart: let the
# synced repository hold only the document, and run this workflow from a second
# repository that pushes the data file into the first with a deploy key or a
# fine-grained token.  The external URL above avoids all of that, and needs no
# Overleaf-to-GitHub authorisation at all.
#
# --- why not the workflow artifact ----------------------------------------
#
# Overleaf cannot read one, which is why this commits rather than relying on
# the upload below.  Artifacts are served as ZIP archives rather than as the
# file itself, and downloading one needs an authenticated request even on a
# public repository, while Overleaf issues a plain unauthenticated GET.  The
# artifact is still worth having as a per-run record of what was fetched.
#
# Overleaf cannot run the fetcher itself either: no shell escape, no network.
# That is what this workflow is for.

name: Refresh INSPIRE data

on:
  schedule:
    # Mondays at 06:00 UTC.  Citation counts move slowly; weekly is plenty.
    - cron: '0 6 * * 1'
  workflow_dispatch:          # and a button, for when you want it now

permissions:
  contents: write             # the commit below; nothing else needs writing

# Two runs committing to the same branch would race.
concurrency:
  group: refresh-inspire
  cancel-in-progress: false

env:
  MAIN: main.tex                     # your document
  DATA: inspirehep-data.tex          # what the fetcher writes

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'      # the fetcher needs only the standard library

      # --strict, because a scheduled run exists only to refresh the figures:
      # if INSPIRE cannot be reached there is nothing to do and the run should
      # say so rather than commit yesterday's numbers again.  Drop it if you
      # would rather a flaky network never turned the badge red.
      - name: Fetch from INSPIRE-HEP
        run: |
          python3 inspirehep-fetch.py "$MAIN" --output "$DATA" --strict

      - name: Commit the refreshed figures
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DATA"
          # Nothing to do if the file is byte-identical, which happens when
          # this runs twice in a day and no count moved.  On the weekly
          # schedule it will normally differ, because the fetcher records the
          # date it confirmed the numbers and that line drives the package's
          # "these figures are getting old" warning -- so a weekly one-line
          # commit is the point rather than noise.
          if git diff --quiet --cached -- "$DATA"; then
            echo "unchanged; nothing to commit"
            exit 0
          fi
          # [skip ci] keeps this from waking whatever else builds on push.
          git commit -m "Refresh INSPIRE figures [skip ci]"
          git push

      # A per-run copy, so a run's log shows exactly what it fetched.  This is
      # for you, not for Overleaf -- see the note at the top.
      - uses: actions/upload-artifact@v4
        with:
          name: inspirehep-data
          path: ${{ env.DATA }}
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          {
            echo '## INSPIRE figures'
            echo
            if [ -f "$DATA" ]; then
              echo '```'
              grep -E '^\\inspiresetauthorstat|^\\inspiresetfetched' "$DATA" || true
              echo '```'
              echo "$(grep -c '^\\inspiresetcites' "$DATA") record(s) tracked."
            else
              echo 'The fetch produced nothing.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
